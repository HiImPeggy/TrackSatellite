<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visualized Satellite Orbit In Hsinchu</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    /* 讓 Cesium 填滿整個視窗 */
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <script>

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjZWIzODZmOC04ZmEzLTQxZjYtYTVmNC0yY2IwYWI2MzQyOWQiLCJpZCI6MzQ4MDI2LCJpYXQiOjE3NTk4MzgyOTR9.DWcN1pc786sERx-aZBHyqHkcAEfrVJA8vPz_rYPwPTM';

    // 初始化 Cesium 3D 地球
    const viewer = new Cesium.Viewer('cesiumContainer', {
      shouldAnimate: true, // 自動播放時間軸
    });

    // 載入我們剛剛生成的 CZML 檔案
    const czmlDataSource = Cesium.CzmlDataSource.load('output/satellite_orbits.czml');
    
    // 將 CZML 資料加入到地球中
    viewer.dataSources.add(czmlDataSource).then(function(dataSource) {
      console.log("CZML 檔案載入成功！");
      // 自動將視角縮放到我們的新竹觀測點
      const hsinchuEntity = dataSource.entities.getById('hsinchu');
      if (hsinchuEntity) {
        viewer.flyTo(hsinchuEntity, {
            offset: new Cesium.HeadingPitchRange(0, -Cesium.Math.toRadians(45), 500000) // 視角
        });
      }
    }).catch(function(error) {
      console.error("CZML 載入失敗:", error);
    });

  </script>
</body>
</html>
